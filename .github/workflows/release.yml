name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  windows-release:
    name: Windows Release Build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Source
        run: go test -race -count=1 ./...

      - name: Build Release
        run: wails build -clean

      - name: Verify Deterministic Wails Bindings
        run: git diff --exit-code -- frontend/wailsjs

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlincode-windows-amd64
          path: build/bin/merlincode.exe
          if-no-files-found: error
